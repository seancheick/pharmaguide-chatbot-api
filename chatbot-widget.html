<div id="pg-chatbot-root"></div>

<style>
/* ═══════════════════════════════════════════════════════════════
   CSS CUSTOM PROPERTIES
   ═══════════════════════════════════════════════════════════════ */
:root {
    --pgchat-teal-50: #F0FDFA;
    --pgchat-teal-100: #CCFBF1;
    --pgchat-teal-200: #99F6E4;
    --pgchat-teal-400: #2DD4BF;
    --pgchat-teal-500: #14B8A6;
    --pgchat-teal-600: #0D9488;
    --pgchat-teal-700: #0F766E;
    
    --pgchat-slate-50: #F8FAFC;
    --pgchat-slate-100: #F1F5F9;
    --pgchat-slate-200: #E2E8F0;
    --pgchat-slate-300: #CBD5E1;
    --pgchat-slate-400: #94A3B8;
    --pgchat-slate-500: #64748B;
    --pgchat-slate-600: #475569;
    --pgchat-slate-700: #334155;
    --pgchat-slate-800: #1E293B;
    --pgchat-slate-900: #0F172A;
    
    --pgchat-white: #FFFFFF;
    --pgchat-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
    --pgchat-shadow-lg: 0 35px 60px -15px rgba(15, 23, 42, 0.3);
    
    --pgchat-radius: 24px;
    --pgchat-radius-sm: 16px;
    --pgchat-radius-full: 9999px;
    
    --pgchat-transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --pgchat-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════ */
#pg-chatbot-root *,
#pg-chatbot-root *::before,
#pg-chatbot-root *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

#pg-chatbot-root {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════════════════
   FLOATING TOGGLE BUTTON
   ═══════════════════════════════════════════════════════════════ */
.pgchat-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 99998;
    width: 64px;
    height: 64px;
    border-radius: var(--pgchat-radius-full);
    background: linear-gradient(135deg, var(--pgchat-teal-500) 0%, var(--pgchat-teal-600) 100%);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
        0 8px 32px rgba(20, 184, 166, 0.35),
        0 0 0 0 rgba(20, 184, 166, 0.4);
    transition: 
        transform var(--pgchat-transition),
        box-shadow var(--pgchat-transition);
    animation: pgchat-pulse 2s ease-in-out infinite;
}

@keyframes pgchat-pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(20, 184, 166, 0.35), 0 0 0 0 rgba(20, 184, 166, 0.4); }
    50% { box-shadow: 0 8px 32px rgba(20, 184, 166, 0.35), 0 0 0 8px rgba(20, 184, 166, 0); }
}

.pgchat-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 40px rgba(20, 184, 166, 0.45);
    animation: none;
}

.pgchat-toggle:active {
    transform: scale(0.95);
}

.pgchat-toggle svg {
    width: 28px;
    height: 28px;
    color: var(--pgchat-white);
    transition: transform var(--pgchat-transition), opacity var(--pgchat-transition);
}

.pgchat-toggle .pgchat-icon-close {
    position: absolute;
    opacity: 0;
    transform: rotate(-90deg) scale(0.5);
}

.pgchat-toggle.is-open .pgchat-icon-chat {
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
}

.pgchat-toggle.is-open .pgchat-icon-close {
    opacity: 1;
    transform: rotate(0) scale(1);
}

/* Notification badge */
.pgchat-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 20px;
    height: 20px;
    background: #EF4444;
    border-radius: 50%;
    border: 2px solid var(--pgchat-white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--pgchat-white);
    opacity: 0;
    transform: scale(0);
    transition: all var(--pgchat-bounce);
}

.pgchat-badge.is-visible {
    opacity: 1;
    transform: scale(1);
}

/* ═══════════════════════════════════════════════════════════════
   CHAT WINDOW
   ═══════════════════════════════════════════════════════════════ */
.pgchat-window {
    position: fixed;
    bottom: 100px;
    right: 24px;
    z-index: 99999;
    width: 400px;
    max-width: calc(100vw - 32px);
    height: 600px;
    max-height: calc(100vh - 140px);
    background: var(--pgchat-white);
    border-radius: var(--pgchat-radius);
    box-shadow: var(--pgchat-shadow-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    
    /* Initial hidden state */
    opacity: 0;
    visibility: hidden;
    transform: translateY(20px) scale(0.95);
    transform-origin: bottom right;
    transition: 
        opacity var(--pgchat-transition),
        visibility var(--pgchat-transition),
        transform var(--pgchat-bounce);
}

.pgchat-window.is-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}

/* ═══════════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════════ */
.pgchat-header {
    background: linear-gradient(135deg, var(--pgchat-teal-600) 0%, var(--pgchat-teal-700) 100%);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
}

.pgchat-avatar {
    width: 48px;
    height: 48px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.pgchat-avatar svg {
    width: 28px;
    height: 28px;
    color: var(--pgchat-white);
}

.pgchat-header-info {
    flex: 1;
    min-width: 0;
}

.pgchat-header-title {
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--pgchat-white);
    margin-bottom: 2px;
}

.pgchat-header-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
}

.pgchat-status-dot {
    width: 8px;
    height: 8px;
    background: #4ADE80;
    border-radius: 50%;
    animation: pgchat-status-pulse 2s ease-in-out infinite;
}

@keyframes pgchat-status-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.pgchat-header-close {
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--pgchat-white);
    transition: background var(--pgchat-transition);
}

.pgchat-header-close:hover {
    background: rgba(255, 255, 255, 0.2);
}

.pgchat-header-close svg {
    width: 20px;
    height: 20px;
}

/* ═══════════════════════════════════════════════════════════════
   MESSAGES AREA
   ═══════════════════════════════════════════════════════════════ */
.pgchat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--pgchat-slate-50);

}

/* Custom scrollbar */
.pgchat-messages::-webkit-scrollbar {
    width: 6px;
}

.pgchat-messages::-webkit-scrollbar-track {
    background: transparent;
}

.pgchat-messages::-webkit-scrollbar-thumb {
    background: var(--pgchat-slate-300);

}

.pgchat-messages::-webkit-scrollbar-thumb:hover {

}

/* Message bubbles */
.pgchat-message {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: pgchat-message-in 0.3s ease-out;
}

@keyframes pgchat-message-in {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.pgchat-message--user {
    align-self: flex-end;
    flex-direction: row-reverse;
}

.pgchat-message--bot {
    align-self: flex-start;
}

.pgchat-message-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.pgchat-message--bot .pgchat-message-avatar {
    background: linear-gradient(135deg, var(--pgchat-teal-500), var(--pgchat-teal-600));
}

.pgchat-message--user .pgchat-message-avatar {
    background: var(--pgchat-slate-600);
}

.pgchat-message-avatar svg {
    width: 18px;
    height: 18px;
    color: var(--pgchat-white);
}

.pgchat-message-content {
    padding: 12px 16px;
    border-radius: var(--pgchat-radius-sm);
    font-size: 14px;
    line-height: 1.6;
}

.pgchat-message--bot .pgchat-message-content {
    background: var(--pgchat-white);
    color: var(--pgchat-slate-700);
    border: 1px solid var(--pgchat-slate-200);
    border-bottom-left-radius: 4px;
}

.pgchat-message--user .pgchat-message-content {
    background: linear-gradient(135deg, var(--pgchat-teal-500), var(--pgchat-teal-600));
    color: var(--pgchat-white);
    border-bottom-right-radius: 4px;
}

/* Message content formatting */
.pgchat-message-content p {
    margin-bottom: 8px;
}

.pgchat-message-content p:last-child {
    margin-bottom: 0;
}

.pgchat-message-content ul,
.pgchat-message-content ol {
    margin: 8px 0;
    padding-left: 20px;
}

.pgchat-message-content li {
    margin-bottom: 4px;
}

.pgchat-message-content strong {
    font-weight: 600;
}

.pgchat-message-content code {
    background: var(--pgchat-slate-100);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', Monaco, monospace;
    font-size: 13px;
}

/* Typing indicator */
.pgchat-typing {
    display: flex;
    gap: 10px;
    align-self: flex-start;
    max-width: 85%;
}

.pgchat-typing-bubble {
    background: var(--pgchat-white);
    border: 1px solid var(--pgchat-slate-200);
    padding: 16px 20px;
    border-radius: var(--pgchat-radius-sm);
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
    align-items: center;
}

.pgchat-typing-dot {
    width: 8px;
    height: 8px;
    background: var(--pgchat-teal-500);
    border-radius: 50%;
    animation: pgchat-typing 1.4s ease-in-out infinite;
}

.pgchat-typing-dot:nth-child(2) {
    animation-delay: 0.2s;
}

.pgchat-typing-dot:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes pgchat-typing {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
    }
    30% {
        transform: translateY(-8px);
        opacity: 1;
    }
}

/* Welcome message */
.pgchat-welcome {
    text-align: center;
    padding: 20px;
    animation: pgchat-message-in 0.5s ease-out;
}

.pgchat-welcome-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--pgchat-teal-100), var(--pgchat-teal-50));
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
}

.pgchat-welcome-icon svg {
    width: 32px;
    height: 32px;
    color: var(--pgchat-teal-600);
}

.pgchat-welcome h3 {
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--pgchat-slate-900);
    margin-bottom: 8px;
}

.pgchat-welcome p {
    font-size: 14px;
    color: var(--pgchat-slate-500);
    margin-bottom: 16px;
}

/* Quick action buttons */
.pgchat-quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
}

.pgchat-quick-btn {
    background: var(--pgchat-white);
    border: 1px solid var(--pgchat-slate-200);
    padding: 8px 14px;
    border-radius: var(--pgchat-radius-full);
    font-size: 13px;
    font-weight: 500;
    color: var(--pgchat-slate-700);
    cursor: pointer;
    transition: all var(--pgchat-transition);
}

.pgchat-quick-btn:hover {
    background: var(--pgchat-teal-50);
    border-color: var(--pgchat-teal-300);
    color: var(--pgchat-teal-700);
}

/* ═══════════════════════════════════════════════════════════════
   INPUT AREA
   ═══════════════════════════════════════════════════════════════ */
.pgchat-input-area {
    padding: 16px;
    background: var(--pgchat-white);
    border-top: 1px solid var(--pgchat-slate-200);
    flex-shrink: 0;
}

.pgchat-input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.pgchat-input {
    flex: 1;
    min-height: 44px;
    max-height: 120px;
    padding: 12px 16px;
    background: var(--pgchat-slate-100);
    border: 1px solid transparent;
    border-radius: var(--pgchat-radius-sm);
    font-family: inherit;
    font-size: 14px;
    color: var(--pgchat-slate-900);
    resize: none;
    outline: none;
    transition: all var(--pgchat-transition);
}

.pgchat-input:focus {
    background: var(--pgchat-white);
    border-color: var(--pgchat-teal-400);
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
}

.pgchat-input::placeholder {
    color: var(--pgchat-slate-400);
}

.pgchat-send {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--pgchat-teal-500), var(--pgchat-teal-600));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--pgchat-white);
    transition: all var(--pgchat-transition);
    flex-shrink: 0;
}

.pgchat-send:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
}

.pgchat-send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.pgchat-send svg {
    width: 20px;
    height: 20px;
}

/* Disclaimer */
.pgchat-disclaimer {
    text-align: center;
    padding: 8px 16px 0;
    font-size: 11px;
    color: var(--pgchat-slate-400);
}

.pgchat-disclaimer a {
    color: var(--pgchat-teal-600);
    text-decoration: none;
}

.pgchat-disclaimer a:hover {
    text-decoration: underline;
}

/* ═══════════════════════════════════════════════════════════════
   ERROR STATE
   ═══════════════════════════════════════════════════════════════ */
.pgchat-error {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: var(--pgchat-radius-sm);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: pgchat-message-in 0.3s ease-out;
}

.pgchat-error-icon {
    width: 20px;
    height: 20px;
    color: #DC2626;
    flex-shrink: 0;
}

.pgchat-error-text {
    flex: 1;
    font-size: 13px;
    color: #991B1B;
}

.pgchat-error-retry {
    background: #DC2626;
    color: var(--pgchat-white);
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--pgchat-transition);
}

.pgchat-error-retry:hover {
    background: #B91C1C;
}

/* ═══════════════════════════════════════════════════════════════
   MOBILE RESPONSIVE
   ═══════════════════════════════════════════════════════════════ */
@media (max-width: 480px) {
    .pgchat-toggle {
        bottom: 16px;
        right: 16px;
        width: 56px;
        height: 56px;
    }
    
    .pgchat-toggle svg {
        width: 24px;
        height: 24px;
    }
    
    .pgchat-window {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;

    }
    
    .pgchat-window.is-open {
        border-radius: 0;
    }
    
    .pgchat-header {
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
    }

        padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
}

/* ═══════════════════════════════════════════════════════════════
   REDUCED MOTION
   ═══════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {

<script>
(function() {
    'use strict';
    
    // ═══════════════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════════════
    
    // 🔴 UPDATE THIS URL after deploying to Vercel!
    const API_ENDPOINT = 'https://pharmaguideai.vercel.app/api/chat';
    
    // Quick action suggestions
    const QUICK_ACTIONS = [
        "Check an interaction",
        "Supplement timing tips",
        "Vitamin D info"
    ];
    
    // ═══════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════
    
    let isOpen = false;
    let isLoading = false;
    let conversationHistory = [];
    
    // ═══════════════════════════════════════════════════════════════
    // DOM ELEMENTS
    // ═══════════════════════════════════════════════════════════════
    
    const root = document.getElementById('pg-chatbot-root');
    
    // Create the UI
    root.innerHTML = `
        <!-- Toggle Button -->
        <button class="pgchat-toggle" id="pgchat-toggle" aria-label="Open chat" aria-expanded="false">
            <svg class="pgchat-icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <svg class="pgchat-icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span class="pgchat-badge" id="pgchat-badge">1</span>
        </button>
        
        <!-- Chat Window -->
        <div class="pgchat-window" id="pgchat-window" role="dialog" aria-label="Chat with PharmaGuide AI">
            
            <!-- Header -->
            <div class="pgchat-header">
                <div class="pgchat-avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <div class="pgchat-header-info">
                    <div class="pgchat-header-title">PharmaGuide AI</div>
                    <div class="pgchat-header-status">
                        <span class="pgchat-status-dot"></span>
                        <span>Online • Supplement Assistant</span>
                    </div>
                </div>
                <button class="pgchat-header-close" id="pgchat-close" aria-label="Close chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <!-- Messages -->
            <div class="pgchat-messages" id="pgchat-messages">
                <div class="pgchat-welcome">
                    <div class="pgchat-welcome-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5"></path>
                            <path d="M2 12l10 5 10-5"></path>
                        </svg>
                    </div>
                    <h3>Hi! I'm PharmaGuide AI 👋</h3>
                    <p>Ask me about supplements, medications, interactions, or timing. I'm here to help!</p>
                    <div class="pgchat-quick-actions" id="pgchat-quick-actions">
                        ${QUICK_ACTIONS.map(action => `
                            <button class="pgchat-quick-btn" data-action="${action}">${action}</button>
                        `).join('')}
                    </div>
                </div>
            </div>
            
            <!-- Input -->
            <div class="pgchat-input-area">
                <div class="pgchat-input-wrapper">
                    <textarea 
                        class="pgchat-input" 
                        id="pgchat-input" 
                        placeholder="Ask about supplements or interactions..."
                        rows="1"
                        aria-label="Type your message"
                    ></textarea>
                    <button class="pgchat-send" id="pgchat-send" aria-label="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="pgchat-disclaimer">
                    Educational info only • Not medical advice • <a href="/privacy-policy" target="_blank">Privacy</a>
                </div>
            </div>
            
        </div>
    `;
    
    // Get references
    const toggleBtn = document.getElementById('pgchat-toggle');
    const chatWindow = document.getElementById('pgchat-window');
    const closeBtn = document.getElementById('pgchat-close');
    const messagesContainer = document.getElementById('pgchat-messages');
    const inputField = document.getElementById('pgchat-input');
    const sendBtn = document.getElementById('pgchat-send');
    const quickActions = document.getElementById('pgchat-quick-actions');
    const badge = document.getElementById('pgchat-badge');
    
    // ═══════════════════════════════════════════════════════════════
    // FUNCTIONS
    // ═══════════════════════════════════════════════════════════════
    
    function toggleChat() {
        isOpen = !isOpen;
        toggleBtn.classList.toggle('is-open', isOpen);
        chatWindow.classList.toggle('is-open', isOpen);
        toggleBtn.setAttribute('aria-expanded', isOpen);
        
        if (isOpen) {
            badge.classList.remove('is-visible');
            inputField.focus();
        }
    }
    
    function closeChat() {
        isOpen = false;
        toggleBtn.classList.remove('is-open');
        chatWindow.classList.remove('is-open');
        toggleBtn.setAttribute('aria-expanded', 'false');
    }
    
    function addMessage(content, isUser = false) {
        // Remove welcome message if present
        const welcome = messagesContainer.querySelector('.pgchat-welcome');
        if (welcome) {
            welcome.remove();
        }
        
        const messageDiv = document.createElement('div');
        messageDiv.className = `pgchat-message pgchat-message--${isUser ? 'user' : 'bot'}`;
        
        const avatar = isUser ? 
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>` :
            `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>`;
        
        // Format content (basic markdown-like formatting)
        const formattedContent = formatMessage(content);
        
        messageDiv.innerHTML = `
            <div class="pgchat-message-avatar">${avatar}</div>
            <div class="pgchat-message-content">${formattedContent}</div>
        `;
        
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
        
        return messageDiv;
    }
    
    function formatMessage(text) {
        // Escape HTML first
        let formatted = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        
        // Bold text
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        
        // Bullet points
        formatted = formatted.replace(/^[•\-]\s(.+)$/gm, '<li>$1</li>');
        formatted = formatted.replace(/(<li>.*<\/li>)+/gs, '<ul>$&</ul>');
        
        // Numbered lists
        formatted = formatted.replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>');
        
        // Line breaks to paragraphs
        const paragraphs = formatted.split(/\n\n+/);
        if (paragraphs.length > 1) {
            formatted = paragraphs.map(p => p.trim() ? `<p>${p}</p>` : '').join('');
        }
        
        // Single line breaks
        formatted = formatted.replace(/\n/g, '<br>');
        
        return formatted;
    }
    
    function addTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'pgchat-typing';
        typingDiv.id = 'pgchat-typing';
        typingDiv.innerHTML = `
            <div class="pgchat-message-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
            </div>
            <div class="pgchat-typing-bubble">
                <span class="pgchat-typing-dot"></span>
                <span class="pgchat-typing-dot"></span>
                <span class="pgchat-typing-dot"></span>
            </div>
        `;
        messagesContainer.appendChild(typingDiv);
        scrollToBottom();
    }
    
    function removeTypingIndicator() {
        const typing = document.getElementById('pgchat-typing');
        if (typing) typing.remove();
    }
    
    function addError(message, retryCallback) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'pgchat-error';
        errorDiv.innerHTML = `
            <svg class="pgchat-error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span class="pgchat-error-text">${message}</span>
            <button class="pgchat-error-retry">Retry</button>
        `;
        
        errorDiv.querySelector('.pgchat-error-retry').addEventListener('click', () => {
            errorDiv.remove();
            if (retryCallback) retryCallback();
        });
        
        messagesContainer.appendChild(errorDiv);
        scrollToBottom();
    }
    
    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    async function sendMessage(text) {
        if (!text.trim() || isLoading) return;
        
        const userMessage = text.trim();
        inputField.value = '';
        inputField.style.height = 'auto';
        
        // Add user message to UI
        addMessage(userMessage, true);
        
        // Add to history
        conversationHistory.push({ role: 'user', content: userMessage });
        
        // Show typing indicator
        isLoading = true;
        sendBtn.disabled = true;
        addTypingIndicator();
        
        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: userMessage,
                    history: conversationHistory.slice(-6) // Last 3 exchanges
                })
            });
            
            removeTypingIndicator();
            
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                
                if (response.status === 429) {
                    addError('Too many requests. Please wait a moment and try again.', () => sendMessage(userMessage));
                } else {
                    addError(errorData.error || 'Something went wrong. Please try again.', () => sendMessage(userMessage));
                }
                return;
            }
            
            const data = await response.json();
            
            // Add bot response
            addMessage(data.reply, false);
            
            // Add to history
            conversationHistory.push({ role: 'assistant', content: data.reply });
            
        } catch (error) {
            console.error('Chat error:', error);
            removeTypingIndicator();
            addError('Connection error. Please check your internet and try again.', () => sendMessage(userMessage));
        } finally {
            isLoading = false;
            sendBtn.disabled = false;
            inputField.focus();
        }
    }
    
    // ═══════════════════════════════════════════════════════════════
    // EVENT LISTENERS
    // ═══════════════════════════════════════════════════════════════
    
    // Toggle chat
    toggleBtn.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', closeChat);
    
    // Send message
    sendBtn.addEventListener('click', () => sendMessage(inputField.value));
    
    // Enter to send (Shift+Enter for new line)
    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage(inputField.value);
        }
    });
    
    // Auto-resize textarea
    inputField.addEventListener('input', () => {
        inputField.style.height = 'auto';
        inputField.style.height = Math.min(inputField.scrollHeight, 120) + 'px';
    });
    
    // Quick actions
    quickActions.addEventListener('click', (e) => {
        if (e.target.classList.contains('pgchat-quick-btn')) {
            const action = e.target.getAttribute('data-action');
            sendMessage(action);
        }
    });
    
    // Close on Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isOpen) {
            closeChat();
        }
    });
    
    // Show badge after 5 seconds if chat hasn't been opened
    setTimeout(() => {
        if (!isOpen && !sessionStorage.getItem('pgchat-opened')) {
            badge.classList.add('is-visible');
        }
    }, 5000);
    
    // Track if chat was opened
    toggleBtn.addEventListener('click', () => {
        sessionStorage.setItem('pgchat-opened', 'true');
    });
    
})();
</script>
