<div id="pgchat-widget"></div>
<style>
/* ═══════════════════════════════════════════════════════════════
   CSS RESET — More targeted to avoid breaking SVGs
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget {
    all: initial;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    position: fixed;
    z-index: 999999;
    /* MOBILE VIEWPORT FIX: Prevent widget from expanding page */
    max-width: 100vw;
    max-width: 100dvw;
    overflow: hidden;
}
#pgchat-widget *,
#pgchat-widget *::before,
#pgchat-widget *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0;
    font: inherit;
    vertical-align: baseline;
}
#pgchat-widget button {
    box-shadow: none !important;
    text-shadow: none !important;
    filter: none !important;
    background-image: none;
    text-decoration: none;
    text-transform: none;
    letter-spacing: normal;
    -webkit-appearance: none;
    appearance: none;
}
/* ═══════════════════════════════════════════════════════════════
   CSS CUSTOM PROPERTIES
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget {
    --chat-teal: #14B8A6;
    --chat-teal-dark: #0D9488;
    --chat-teal-light: #CCFBF1;
    --chat-teal-soft: rgba(20, 184, 166, 0.1);
   
    --chat-slate-50: #F8FAFC;
    --chat-slate-100: #F1F5F9;
    --chat-slate-200: #E2E8F0;
    --chat-slate-300: #CBD5E1;
    --chat-slate-400: #94A3B8;
    --chat-slate-500: #64748B;
    --chat-slate-600: #475569;
    --chat-slate-700: #334155;
    --chat-slate-800: #1E293B;
    --chat-slate-900: #0F172A;
   
    --chat-white: #FFFFFF;
    --chat-black: #000000;
   
    --chat-radius: 20px;
    --chat-radius-lg: 24px;
    --chat-radius-sm: 12px;
   
    --chat-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.04),
        0 8px 16px rgba(0, 0, 0, 0.08),
        0 24px 48px rgba(0, 0, 0, 0.12);
   
    --chat-shadow-toggle:
        0 4px 12px rgba(20, 184, 166, 0.3),
        0 8px 24px rgba(20, 184, 166, 0.2);
   
    --chat-transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --chat-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
   
    /* KEYBOARD FIX: CSS variable for dynamic viewport height */
    --chat-viewport-height: 100vh;
}
/* ═══════════════════════════════════════════════════════════════
   FLOATING TOGGLE BUTTON
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget .chat-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--chat-teal) 0%, var(--chat-teal-dark) 100%);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--chat-shadow-toggle);
    transition: transform var(--chat-transition), box-shadow var(--chat-transition);
    z-index: 999999;
    outline: none;
}
#pgchat-widget .chat-toggle:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(20, 184, 166, 0.4), 0 12px 32px rgba(20, 184, 166, 0.25);
}
#pgchat-widget .chat-toggle:active {
    transform: scale(0.95);
}
/* Toggle Icons */
#pgchat-widget .chat-toggle svg {
    width: 26px;
    height: 26px;
    color: var(--chat-white);
    stroke: var(--chat-white);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform var(--chat-transition), opacity var(--chat-transition);
    position: absolute;
}
#pgchat-widget .chat-toggle .icon-close {
    opacity: 0;
    transform: rotate(-90deg) scale(0.5);
}
#pgchat-widget .chat-toggle.is-active .icon-chat {
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
}
#pgchat-widget .chat-toggle.is-active .icon-close {
    opacity: 1;
    transform: rotate(0) scale(1);
}
/* Pulse animation */
#pgchat-widget .chat-toggle::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--chat-teal) 0%, var(--chat-teal-dark) 100%);
    animation: chat-pulse 2.5s ease-out infinite;
    z-index: -1;
}
/* Hover tooltip */
#pgchat-widget .chat-toggle::after {
    content: 'Chat with PharmaGuide AI';
    position: absolute;
    right: 70px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--chat-slate-800);
    color: var(--chat-white);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 10px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
#pgchat-widget .chat-toggle:hover::after {
    opacity: 1;
}
#pgchat-widget .chat-toggle.is-active::after {
    display: none;
}
#pgchat-widget .chat-toggle:hover::before,
#pgchat-widget .chat-toggle.is-active::before {
    animation: none;
}
@keyframes chat-pulse {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.5); opacity: 0; }
}
/* ═══════════════════════════════════════════════════════════════
   CHAT WINDOW
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget .chat-window {
    position: fixed;
    bottom: 100px;
    right: 24px;
    width: 380px;
    height: 580px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 140px);
    background: var(--chat-white);
    border-radius: var(--chat-radius-lg);
    box-shadow: var(--chat-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 999998;
   
    /* Animation */
    opacity: 0;
    visibility: hidden;
    transform: translateY(16px) scale(0.96);
    transform-origin: bottom right;
    transition:
        opacity var(--chat-transition),
        visibility var(--chat-transition),
        transform var(--chat-bounce);
}
#pgchat-widget .chat-window.is-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}
/* ═══════════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget .chat-header {
    background: linear-gradient(135deg, var(--chat-teal) 0%, var(--chat-teal-dark) 100%);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
}
#pgchat-widget .chat-avatar {
    width: 44px;
    height: 44px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    padding: 6px;
}
#pgchat-widget .chat-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
#pgchat-widget .chat-header-info {
    flex: 1;
    min-width: 0;
}
#pgchat-widget .chat-title {
    font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--chat-white);
    margin: 0 0 3px 0;
    letter-spacing: -0.01em;
}
#pgchat-widget .chat-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 500;
}
#pgchat-widget .status-dot {
    width: 7px;
    height: 7px;
    background: #4ADE80;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
}
/* New Chat Button */
#pgchat-widget .chat-new {
    width: 34px;
    height: 34px;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--chat-transition);
    flex-shrink: 0;
    outline: none;
}
#pgchat-widget .chat-new:hover {
    background: rgba(255, 255, 255, 0.25);
}
#pgchat-widget .chat-new svg {
    width: 16px;
    height: 16px;
    color: var(--chat-white);
    stroke: var(--chat-white);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* Close Button */
#pgchat-widget .chat-close {
    width: 34px;
    height: 34px;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--chat-transition);
    flex-shrink: 0;
    outline: none;
}
#pgchat-widget .chat-close:hover {
    background: rgba(255, 255, 255, 0.25);
}
#pgchat-widget .chat-close svg {
    width: 18px;
    height: 18px;
    color: var(--chat-white);
    stroke: var(--chat-white);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* ═══════════════════════════════════════════════════════════════
   MESSAGES AREA
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget .chat-messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--chat-slate-50);
    scroll-behavior: smooth;
}
/* Custom Scrollbar */
#pgchat-widget .chat-messages::-webkit-scrollbar {
    width: 5px;
}
#pgchat-widget .chat-messages::-webkit-scrollbar-track {
    background: transparent;
}
#pgchat-widget .chat-messages::-webkit-scrollbar-thumb {
    background: var(--chat-slate-300);
    border-radius: 3px;
}
/* Message Bubbles */
#pgchat-widget .msg {
    display: flex;
    gap: 10px;
    max-width: 88%;
    animation: msg-in 0.25s ease-out;
}
@keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
#pgchat-widget .msg-user {
    align-self: flex-end;
    flex-direction: row-reverse;
}
#pgchat-widget .msg-bot {
    align-self: flex-start;
}
/* Message Avatars */
#pgchat-widget .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
}
#pgchat-widget .msg-bot .msg-avatar {
    background: var(--chat-white);
    border: 1px solid var(--chat-slate-200);
    padding: 4px;
}
#pgchat-widget .msg-bot .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
#pgchat-widget .msg-user .msg-avatar {
    background: linear-gradient(135deg, var(--chat-slate-600), var(--chat-slate-700));
}
#pgchat-widget .msg-user .msg-avatar svg {
    width: 16px;
    height: 16px;
    color: var(--chat-white);
    stroke: var(--chat-white);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* Message Bubbles */
#pgchat-widget .msg-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
    hyphens: auto;
    min-width: 0;
}
#pgchat-widget .msg-bot .msg-bubble {
    background: var(--chat-white);
    color: var(--chat-slate-700);
    border: 1px solid var(--chat-slate-200);
    border-bottom-left-radius: 4px;
}
#pgchat-widget .msg-user .msg-bubble {
    background: linear-gradient(135deg, var(--chat-teal), var(--chat-teal-dark));
    color: var(--chat-white);
    border-bottom-right-radius: 4px;
}
/* Message Content Formatting */
#pgchat-widget .msg-bubble p {
    margin: 0 0 6px 0;
}
#pgchat-widget .msg-bubble p:last-child {
    margin-bottom: 0;
}
#pgchat-widget .msg-bubble ul,
#pgchat-widget .msg-bubble ol {
    margin: 4px 0;
    padding-left: 18px;
}
#pgchat-widget .msg-bubble li {
    margin-bottom: 2px;
    list-style: disc;
}
#pgchat-widget .msg-bubble li:last-child {
    margin-bottom: 0;
}
#pgchat-widget .msg-bubble strong {
    font-weight: 600;
    color: var(--chat-slate-900);
}
#pgchat-widget .msg-user .msg-bubble strong {
    color: var(--chat-white);
}
#pgchat-widget .msg-bubble em {
    font-style: italic;
    color: var(--chat-slate-500);
}
#pgchat-widget .msg-user .msg-bubble em {
    color: rgba(255, 255, 255, 0.85);
}
/* Typing Indicator */
#pgchat-widget .typing {
    display: flex;
    gap: 10px;
    align-self: flex-start;
}
#pgchat-widget .typing .msg-avatar {
    background: var(--chat-white);
    border: 1px solid var(--chat-slate-200);
    padding: 4px;
}
#pgchat-widget .typing-dots {
    background: var(--chat-white);
    border: 1px solid var(--chat-slate-200);
    padding: 14px 18px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 5px;
    align-items: center;
}
#pgchat-widget .typing-dot {
    width: 7px;
    height: 7px;
    background: var(--chat-teal);
    border-radius: 50%;
    animation: typing-bounce 1.2s ease-in-out infinite;
}
#pgchat-widget .typing-dot:nth-child(2) {
    animation-delay: 0.2s;
}
#pgchat-widget .typing-dot:nth-child(3) {
    animation-delay: 0.4s;
}
@keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
}
/* ═══════════════════════════════════════════════════════════════
   WELCOME STATE
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px 16px;
}
#pgchat-widget .welcome-icon {
    width: 64px;
    height: 64px;
    background: var(--chat-white);
    border: 2px solid var(--chat-slate-200);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    overflow: hidden;
    padding: 10px;
}
#pgchat-widget .welcome-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
#pgchat-widget .welcome h3 {
    font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--chat-slate-800);
    margin: 0 0 8px 0;
    letter-spacing: -0.01em;
}
#pgchat-widget .welcome p {
    font-size: 14px;
    color: var(--chat-slate-500);
    margin: 0 0 20px 0;
    line-height: 1.5;
}
/* Quick Actions */
#pgchat-widget .quick-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    max-width: 280px;
}
#pgchat-widget .quick-btn {
    background: var(--chat-white);
    border: 1px solid var(--chat-slate-200);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--chat-slate-600);
    cursor: pointer;
    transition: all var(--chat-transition);
    font-family: inherit;
    white-space: normal;
    text-align: left;
    width: 100%;
    line-height: 1.35;
    box-shadow: none;
    text-shadow: none;
    filter: none;
    outline: none;
    background-image: none;
    text-decoration: none;
    letter-spacing: normal;
    text-transform: none;
    -webkit-appearance: none;
    appearance: none;
}
#pgchat-widget .quick-btn:hover {
    background: var(--chat-teal-soft);
    border-color: var(--chat-teal);
    color: var(--chat-teal-dark);
    transform: translateY(-1px);
    box-shadow: none;
    text-shadow: none;
    filter: none;
}
#pgchat-widget .quick-btn:active {
    transform: translateY(0);
}
/* ═══════════════════════════════════════════════════════════════
   INPUT AREA
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget .chat-input-area {
    padding: 16px 20px;
    background: var(--chat-white);
    border-top: 1px solid var(--chat-slate-100);
    flex-shrink: 0;
}
#pgchat-widget .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}
#pgchat-widget .chat-input {
    flex: 1;
    min-width: 0;
    background: var(--chat-slate-100);
    border: 1px solid transparent;
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 16px; /* Prevents iOS zoom on focus */
    font-family: inherit;
    color: var(--chat-slate-800);
    resize: none;
    outline: none;
    transition: all var(--chat-transition);
    line-height: 1.4;
    max-height: 100px;
}
#pgchat-widget .chat-input:focus {
    background: var(--chat-white);
    border-color: var(--chat-teal);
    box-shadow: 0 0 0 3px var(--chat-teal-soft);
}
#pgchat-widget .chat-input::placeholder {
    color: var(--chat-slate-400);
}
/* Send Button */
#pgchat-widget .send-btn {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--chat-teal), var(--chat-teal-dark));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--chat-transition);
    flex-shrink: 0;
    outline: none;
}
#pgchat-widget .send-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
}
#pgchat-widget .send-btn:active:not(:disabled) {
    transform: scale(0.95);
}
#pgchat-widget .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
#pgchat-widget .send-btn svg {
    width: 18px;
    height: 18px;
    color: var(--chat-white);
    stroke: var(--chat-white);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* Disclaimer */
#pgchat-widget .disclaimer {
    text-align: center;
    padding-top: 10px;
    font-size: 10px;
    color: var(--chat-slate-400);
    letter-spacing: 0.01em;
}
#pgchat-widget .disclaimer a {
    color: var(--chat-teal);
    text-decoration: none;
}
#pgchat-widget .disclaimer a:hover {
    text-decoration: underline;
}
/* ═══════════════════════════════════════════════════════════════
   ERROR STATE
   ═══════════════════════════════════════════════════════════════ */
#pgchat-widget .error-msg {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}
#pgchat-widget .error-msg svg {
    width: 18px;
    height: 18px;
    color: #DC2626;
    stroke: #DC2626;
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
}
#pgchat-widget .error-msg span {
    flex: 1;
    font-size: 12px;
    color: #991B1B;
    min-width: 0;
}
#pgchat-widget .error-msg button {
    background: #DC2626;
    color: var(--chat-white);
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
}
#pgchat-widget .error-msg button:hover {
    background: #B91C1C;
}
/* ═══════════════════════════════════════════════════════════════
   MOBILE RESPONSIVE — KEYBOARD FIX
   ═══════════════════════════════════════════════════════════════ */
@media (max-width: 480px) {
    #pgchat-widget .chat-toggle {
        bottom: 16px;
        right: 16px;
        width: 54px;
        height: 54px;
    }
   
    #pgchat-widget .chat-toggle.is-active {
        display: none;
    }
   
    #pgchat-widget .chat-toggle svg {
        width: 22px;
        height: 22px;
    }
   
    #pgchat-widget .chat-window {
        position: fixed;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
       
        /* KEYBOARD FIX: Use CSS variable that JS will update */
        height: calc(var(--chat-viewport-height, 100vh) - 60px);
        max-height: calc(var(--chat-viewport-height, 100vh) - 60px);
       
        max-width: 100%;
        overflow: hidden;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
       
        /* Smooth height transitions when keyboard opens/closes */
        transition:
            opacity var(--chat-transition),
            visibility var(--chat-transition),
            transform var(--chat-bounce),
            height 0.2s ease-out,
            max-height 0.2s ease-out;
    }
   
    #pgchat-widget .chat-header {
        padding: 14px 16px;
        border-radius: 20px 20px 0 0;
        min-width: 0;
    }
   
    #pgchat-widget .chat-messages {
        padding: 16px;
        overflow-x: hidden;
        min-width: 0;
        /* Allow messages to shrink when keyboard opens */
        flex: 1;
        min-height: 0;
    }
   
    #pgchat-widget .chat-input-area {
        padding: 12px 16px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
        min-width: 0;
        /* Keep input area fixed at bottom */
        flex-shrink: 0;
    }
   
    #pgchat-widget .msg {

</style>
<script>
(function() {
    'use strict';
   
    const API_ENDPOINT = 'https://pharmaguide-chatbot-api.vercel.app/api/chat';
   
    const LOGO_URL = 'https://res.cloudinary.com/domlxsdtc/image/upload/v1767311370/IMG_5391_vwzfzi.png';
   
    const QUICK_ACTIONS = [
  "Can I take magnesium with antidepressants?",
  "Can I take zinc and iron together?",
  "Can I take ashwagandha with anxiety meds?"
];
   
    let isOpen = false;
    let isLoading = false;
    let history = [];
   
    const widget = document.getElementById('pgchat-widget');
   
    widget.innerHTML = `
        <button class="chat-toggle" id="chat-toggle" aria-label="Open chat" aria-expanded="false">
            <svg class="icon-chat" viewBox="0 0 24 24">
                <path d="M12 8V4H8"></path>
                <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                <path d="M2 14h2"></path>
                <path d="M20 14h2"></path>
                <path d="M15 13v2"></path>
                <path d="M9 13v2"></path>
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
       
        <div class="chat-window" id="chat-window" role="dialog" aria-label="Chat with PharmaGuide AI">
           
            <div class="chat-header">
                <div class="chat-avatar">
                    <img src="${LOGO_URL}" alt="PharmaGuide" />
                </div>
                <div class="chat-header-info">
                    <div class="chat-title">PharmaGuide AI</div>
                    <div class="chat-status">
                        <span class="status-dot"></span>
                        <span>Online</span>
                    </div>
                </div>
                <button class="chat-new" id="chat-new" aria-label="New conversation" title="New conversation">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </button>
                <button class="chat-close" id="chat-close" aria-label="Close chat">
                    <svg viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
           
            <div class="chat-messages" id="chat-messages">
                <div class="welcome">
                    <div class="welcome-icon">
                        <img src="${LOGO_URL}" alt="PharmaGuide" />
                    </div>
                    <h3>Hi! I'm PharmaGuide AI 👋</h3>
                    <p>Ask about supplements, medications, or interactions. I'm here to help!</p>
                    <div class="quick-actions" id="quick-actions">
                        ${QUICK_ACTIONS.map(a => `<button class="quick-btn" data-q="${a.replace(/"/g, '&quot;')}">${a}</button>`).join('')}
                    </div>
                </div>
            </div>
           
            <div class="chat-input-area">
                <div class="input-row">
                    <textarea
                        class="chat-input"
                        id="chat-input"
                        placeholder="Ask about supplements..."
                        rows="1"
                        aria-label="Type your message"
                    ></textarea>
                    <button class="send-btn" id="send-btn" aria-label="Send message">
                        <svg viewBox="0 0 24 24">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="disclaimer">
                    Educational info only • Not medical advice
                </div>
            </div>
        </div>
    `;
   
    // ═══════════════════════════════════════════════════════════════
    // REFERENCES
    // ═══════════════════════════════════════════════════════════════
   
    const toggleBtn = document.getElementById('chat-toggle');
    const chatWindow = document.getElementById('chat-window');
    const closeBtn = document.getElementById('chat-close');
    const newChatBtn = document.getElementById('chat-new');
    const messages = document.getElementById('chat-messages');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const quickActions = document.getElementById('quick-actions');
   
    // ═══════════════════════════════════════════════════════════════
    // MOBILE KEYBOARD FIX — Visual Viewport API
    // ═══════════════════════════════════════════════════════════════
   
    let scrollPosition = 0;
   
    function isMobile() {
        return window.innerWidth <= 480;
    }
   
    function updateViewportHeight() {
        // Use visualViewport if available (handles keyboard)
        const vh = window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;
       
        widget.style.setProperty('--chat-viewport-height', `${vh}px`);
       
        // Also scroll messages to bottom when keyboard opens
        if (isOpen && isMobile()) {
            requestAnimationFrame(() => {
                messages.scrollTop = messages.scrollHeight;
            });
        }
    }
   
    function lockBody() {
        scrollPosition = window.pageYOffset;
        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.top = `-${scrollPosition}px`;
        document.body.style.width = '100%';
    }
   
    function unlockBody() {
        document.body.style.removeProperty('overflow');
        document.body.style.removeProperty('position');
        document.body.style.removeProperty('top');
        document.body.style.removeProperty('width');
        window.scrollTo(0, scrollPosition);
    }
   
    // Set up Visual Viewport listener for keyboard
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateViewportHeight);
        window.visualViewport.addEventListener('scroll', updateViewportHeight);
    }
   
    // Initial viewport height
    updateViewportHeight();
   
    // ═══════════════════════════════════════════════════════════════
    // FUNCTIONS
    // ═══════════════════════════════════════════════════════════════
   
    function toggle() {
        isOpen = !isOpen;
        toggleBtn.classList.toggle('is-active', isOpen);
        chatWindow.classList.toggle('is-open', isOpen);
        toggleBtn.setAttribute('aria-expanded', isOpen);
       
        if (isMobile()) {
            if (isOpen) {
                lockBody();
                updateViewportHeight();
            } else {
                unlockBody();
                // Blur input to close keyboard when closing chat
                input.blur();
            }
        }
       
        if (isOpen) {
            // Small delay to let animation complete
            setTimeout(() => input.focus(), 300);
        }
    }
   
    function close() {
        isOpen = false;
        toggleBtn.classList.remove('is-active');
        chatWindow.classList.remove('is-open');
        toggleBtn.setAttribute('aria-expanded', 'false');
       
        // Blur input to close keyboard
        input.blur();
       
        if (isMobile()) {
            unlockBody();
        }
    }
   
    function newChat() {
        history = [];
        messages.innerHTML = `
            <div class="welcome">
                <div class="welcome-icon">
                    <img src="${LOGO_URL}" alt="PharmaGuide" />
                </div>
                <h3>Hi! I'm PharmaGuide AI 👋</h3>
                <p>Ask about supplements, medications, or interactions. I'm here to help!</p>
                <div class="quick-actions" id="quick-actions">
                    ${QUICK_ACTIONS.map(a => `<button class="quick-btn" data-q="${a.replace(/"/g, '&quot;')}">${escapeHtml(a)}</button>`).join('')}
                </div>
            </div>
        `;
        // Re-bind quick actions on the new DOM
        messages.querySelector('.quick-actions').addEventListener('click', handleQuickAction);
        input.focus();
    }

    function handleQuickAction(e) {
        if (e.target.classList.contains('quick-btn')) {
            if (!isOpen) toggle();
            send(e.target.getAttribute('data-q'));
        }
    }

    function addMsg(content, isUser) {
        const welcome = messages.querySelector('.welcome');
        if (welcome) welcome.remove();
       
        const div = document.createElement('div');
        div.className = `msg ${isUser ? 'msg-user' : 'msg-bot'}`;
       
        const avatar = isUser
            ? `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
            : `<img src="${LOGO_URL}" alt="AI" />`;
       
        div.innerHTML = `
            <div class="msg-avatar">${avatar}</div>
            <div class="msg-bubble">${formatMsg(content)}</div>
        `;
       
        messages.appendChild(div);
        scroll();
    }
   
    function formatMsg(text) {
        let f = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');

        // Group consecutive bullet lines into <ul> blocks
        const lines = f.split('\n');
        const result = [];
        let inList = false;
        for (const line of lines) {
            const bullet = line.match(/^[•\-]\s(.+)$/);
            if (bullet) {
                if (!inList) { result.push('<ul>'); inList = true; }
                result.push(`<li>${bullet[1]}</li>`);
            } else {
                if (inList) { result.push('</ul>'); inList = false; }
                result.push(line);
            }
        }
        if (inList) result.push('</ul>');
        f = result.join('\n');

        // Strip newlines inside <ul> blocks so they don't become <br>
        f = f.replace(/<ul>\n?/g, '<ul>')
             .replace(/\n?<\/ul>/g, '</ul>')
             .replace(/<\/li>\n<li>/g, '</li><li>');

        // Paragraphs from double newlines
        const paras = f.split(/\n\n+/);
        if (paras.length > 1) {
            f = paras.map(p => p.trim() ? `<p>${p}</p>` : '').join('');
        }

        return f.replace(/\n/g, '<br>');
    }
   
    function addTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing';
        div.innerHTML = `
            <div class="msg-avatar">
                <img src="${LOGO_URL}" alt="AI" />
            </div>
            <div class="typing-dots">
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            </div>
        `;
        messages.appendChild(div);
        scroll();
    }
   
    function removeTyping() {
        const t = document.getElementById('typing');
        if (t) t.remove();
    }
   
    function escapeHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function addError(msg, retry, retryAfter) {
        const div = document.createElement('div');
        div.className = 'error-msg';
        div.innerHTML = `
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>${escapeHtml(msg)}</span>
            <button>Retry</button>
        `;
        const btn = div.querySelector('button');
        if (retryAfter && retryAfter > 0) {
            let secs = retryAfter;
            btn.disabled = true;
            btn.textContent = `Retry (${secs}s)`;
            const interval = setInterval(() => {
                secs--;
                if (secs <= 0) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.textContent = 'Retry';
                } else {
                    btn.textContent = `Retry (${secs}s)`;
                }
            }, 1000);
        }
        btn.addEventListener('click', () => { div.remove(); if (retry) retry(); });
        messages.appendChild(div);
        scroll();
    }
   
    function scroll() {
        // Use requestAnimationFrame for smoother scrolling
        requestAnimationFrame(() => {
            messages.scrollTop = messages.scrollHeight;
        });
    }
   
    async function send(text) {
        if (!text.trim() || isLoading) return;

        const userMsg = text.trim();
        input.value = '';
        input.style.height = 'auto';

        addMsg(userMsg, true);
        history.push({ role: 'user', content: userMsg });

        isLoading = true;
        sendBtn.disabled = true;
        addTyping();

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);

        try {
            const res = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userMsg, history: history.slice(-10) }),
                signal: controller.signal
            });

            clearTimeout(timeout);
            removeTyping();

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                if (res.status === 429) {
                    addError('Too many requests. Please wait.', () => send(userMsg), err.retryAfter || 30);
                } else {
                    addError(err.error || 'Something went wrong.', () => send(userMsg));
                }
                return;
            }

            const data = await res.json();
            addMsg(data.reply, false);
            history.push({ role: 'assistant', content: data.reply });

        } catch (e) {
            clearTimeout(timeout);
            console.error('Chat error:', e);
            removeTyping();
            if (e.name === 'AbortError') {
                addError('Response took too long. Try again.', () => send(userMsg));
            } else {
                addError('Connection error. Try again.', () => send(userMsg));
            }
        } finally {
            isLoading = false;
            sendBtn.disabled = false;
            if (!isMobile()) {
                input.focus();
            }
        }
    }
   
    // ═══════════════════════════════════════════════════════════════
    // EVENTS
    // ═══════════════════════════════════════════════════════════════
   
    toggleBtn.addEventListener('click', toggle);
    closeBtn.addEventListener('click', close);
    newChatBtn.addEventListener('click', newChat);
    sendBtn.addEventListener('click', () => send(input.value));
   
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send(input.value);
        }
    });
   
    input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });
   
    // Handle input focus/blur for better mobile experience
    input.addEventListener('focus', () => {
        if (isMobile()) {
            // Give keyboard time to open, then update viewport
            setTimeout(updateViewportHeight, 100);
            setTimeout(updateViewportHeight, 300);
        }
    });
   
    input.addEventListener('blur', () => {
        if (isMobile()) {
            // Give keyboard time to close, then update viewport
            setTimeout(updateViewportHeight, 100);
        }
    });
   
    quickActions.addEventListener('click', handleQuickAction);
   
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && isOpen) close();
    });
   
    // Handle orientation change
    window.addEventListener('orientationchange', () => {
        setTimeout(updateViewportHeight, 100);
        setTimeout(updateViewportHeight, 300);
    });
   
    // Handle resize (desktop)
    window.addEventListener('resize', () => {
        if (!isMobile()) {
            updateViewportHeight();
        }
    });
   
})();
</script>
