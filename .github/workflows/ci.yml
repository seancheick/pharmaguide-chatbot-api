name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Includes the pinned canaries (test/canaries.test.js). No API keys are needed:
      # the LLM chain is stubbed and the live-provider test is opt-in.
      - run: npm test
